<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acervo - Biblioteca do Berne</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #090d16;
            background-image: 
                linear-gradient(rgba(9, 13, 22, 0.85), rgba(9, 13, 22, 0.95)), 
                url('https://raw.githubusercontent.com/DeguchiBerne/biblioteca/main/bibliofundo.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        /* Container Centralizado da Estante (Madeira mais clara) */
        .shelf-container-wrapper {
            max-width: 860px;
            margin: 0 auto;
            background: 
                linear-gradient(rgba(40, 22, 10, 0.4), rgba(30, 15, 5, 0.5)),
                url('https://raw.githubusercontent.com/DeguchiBerne/biblioteca/main/textura-madeira.jpg');
            background-size: cover;
            background-position: center;
            padding: 25px 15px;
            border-radius: 10px;
            border: 4px solid #5a3214;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.95), inset 0 0 40px rgba(0,0,0,0.5);
            filter: brightness(1.15); /* Aumenta a luminosidade geral da estante */
        }

        /* Prateleira Individual */
        .shelf {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            flex-wrap: nowrap;
            gap: 2px;
            padding: 0 15px;
            min-height: 240px;
            background: linear-gradient(180deg, rgba(0,0,0,0.3) 0%, rgba(255,255,255,0.05) 40%, rgba(0,0,0,0.4) 100%);
            border-top: 6px solid transparent;
            border-bottom: 26px solid transparent;
            border-image: url('https://raw.githubusercontent.com/DeguchiBerne/biblioteca/main/textura-madeira.jpg') 30 round;
            position: relative;
            margin-bottom: 2rem;
            border-radius: 2px 2px 6px 6px;
            box-shadow: 
                inset 0 15px 20px -8px rgba(0,0,0,0.7), 
                inset 0 -6px 8px rgba(0,0,0,0.7),
                0 15px 25px -5px rgba(0,0,0,0.7);
            overflow: hidden;
        }

        .shelf:last-child {
            margin-bottom: 0;
        }

        .shelf::after {
            content: '';
            position: absolute;
            bottom: -26px;
            left: 0;
            right: 0;
            height: 7px;
            background: linear-gradient(90deg, rgba(40,20,10,0.8), rgba(90,50,30,0.9), rgba(40,20,10,0.8));
            opacity: 0.95;
        }

        /* Lombada do Livro com Cores e Textura de Couro Mais Claras e Vivas */
        .book-spine {
            cursor: pointer;
            border-radius: 3px 3px 0 0;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 8px 2px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: inset -4px 0 8px rgba(0,0,0,0.4), 2px 3px 8px rgba(0,0,0,0.6);
            position: relative;
            flex-shrink: 0;
            user-select: none;
            background-blend-mode: normal; /* Deixa a cor base mais realçada sem escurecer demais */
            background-image: 
                url('https://raw.githubusercontent.com/DeguchiBerne/biblioteca/main/textura-couro.jpg'),
                radial-gradient(circle at 50% 30%, rgba(255,255,255,0.25) 0%, rgba(0,0,0,0.15) 100%);
            background-size: cover;
            background-position: center;
        }

        .book-spine:hover {
            transform: translateY(-8px);
            box-shadow: inset -4px 0 8px rgba(0,0,0,0.4), 4px 8px 14px rgba(0,0,0,0.8);
            z-index: 10;
        }

        /* Relevos decorativos nas extremidades da lombada */
        .book-spine::before {
            content: '';
            position: absolute;
            top: 6px;
            left: 2px;
            right: 2px;
            height: 2px;
            background: rgba(255, 240, 200, 0.6);
            box-shadow: 0 4px 0 rgba(0,0,0,0.25), 0 12px 0 rgba(255, 240, 200, 0.4);
            z-index: 2;
        }

        .book-spine::after {
            content: '';
            position: absolute;
            bottom: 6px;
            left: 2px;
            right: 2px;
            height: 2px;
            background: rgba(255, 240, 200, 0.6);
            box-shadow: 0 -4px 0 rgba(0,0,0,0.25);
            z-index: 2;
        }

        /* Espaço livre entre os livros na prateleira */
        .shelf-gap {
            flex-shrink: 0;
            background: transparent;
        }

        /* Título na lombada em modo vertical */
        .book-title-vertical {
            writing-mode: vertical-rl;
            text-orientation: mixed;
            font-weight: 600;
            color: #ffffff;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            letter-spacing: 0.4px;
            margin: auto 0;
            text-align: center;
            text-shadow: 0 1px 3px rgba(0,0,0,0.95);
            z-index: 3;
        }

        #modalDetalhes > div {
            animation: abrirLivro 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            transform-origin: center;
        }
        @keyframes abrirLivro {
            0% { opacity: 0; transform: scale(0.7) rotateY(-15deg); }
            100% { opacity: 1; transform: scale(1) rotateY(0deg); }
        }

        @keyframes organizarEstante {
            0% { opacity: 0; transform: translateY(15px) scale(0.95); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }
        .card-organizando {
            animation: organizarEstante 0.4s ease-in-out forwards;
        }

        .pagina-livro {
            background-color: #fcf8f2;
            background-image: radial-gradient(#e6dbcc 0.75px, transparent 0.75px);
            background-size: 16px 16px;
        }

        .dobra-livro {
            background: linear-gradient(90deg, rgba(0,0,0,0.15), rgba(0,0,0,0.05) 50%, rgba(0,0,0,0.25));
        }
    </style>
</head>
<body class="text-slate-100 min-h-screen p-3 sm:p-6 pb-28 relative">
    <div class="max-w-7xl mx-auto">
        <header class="mb-6 text-center flex flex-col items-center">
            <div class="w-full flex justify-start sm:absolute sm:left-6 sm:top-6 mb-4 sm:mb-0">
                <a href="index.html" class="bg-slate-900 hover:bg-slate-800 text-slate-200 px-4 py-2 rounded-lg text-xs font-semibold shadow transition flex items-center gap-2 border border-slate-700">
                    &larr; Voltar ao Início
                </a>
            </div>

            <h1 class="text-2xl sm:text-4xl font-bold mb-1 drop-shadow-md">📖 Acervo da Biblioteca</h1>
            <p class="text-xs sm:text-sm text-slate-300 drop-shadow">Modo de visualização pública para visitantes</p>
            
            <div id="stats" class="my-4 w-full max-w-xs">
                <div class="bg-slate-900/90 border border-slate-800 p-3 rounded-lg shadow-xl text-center backdrop-blur-sm">
                    <p class="text-[10px] sm:text-xs text-slate-400 uppercase tracking-wider">Obras no Acervo</p>
                    <p id="stat-total" class="text-xl sm:text-2xl font-bold text-amber-400">0</p>
                </div>
            </div>

            <div class="w-full max-w-md mt-2">
                <input type="text" id="searchInput" placeholder="Pesquisar por título na estante..." 
                    class="w-full px-4 py-2.5 rounded-lg bg-slate-900/90 border border-slate-700 text-white text-sm focus:outline-none focus:border-amber-500 shadow-inner backdrop-blur-sm">
            </div>

            <div id="formatFilters" class="flex overflow-x-auto w-full max-w-3xl gap-2 mt-4 pb-2 px-1 justify-start sm:justify-center scrollbar-none"></div>
        </header>

        <div id="loading" class="text-center text-slate-300 py-20 text-base drop-shadow">Carregando estante da biblioteca...</div>

        <div id="estanteContainer" class="hidden shelf-container-wrapper">
            <div class="text-xs text-amber-100 mb-4 italic text-center sm:text-left flex items-center justify-between px-2 drop-shadow border-b border-amber-900/40 pb-2">
                <span id="status-exibicao">Mostrando as primeiras estantes do acervo:</span>
                <span class="text-[11px] text-amber-300 font-medium">Dica: Clique em qualquer lombada para detalhes.</span>
            </div>
            
            <div id="prateleirasWrapper" class="space-y-6"></div>
        </div>
    </div>

    <footer class="absolute bottom-0 left-0 w-full text-center py-3 bg-slate-950/90 backdrop-blur-md border-t border-slate-900 text-[11px] sm:text-xs text-slate-400 space-y-0.5 px-2">
        <p>Criado por <strong class="text-slate-200">Bernardo Deguchi</strong> • 2026</p>
    </footer>

    <div id="modalDetalhes" class="fixed inset-0 bg-black/80 backdrop-blur-md hidden z-50 flex items-center justify-center p-2 sm:p-4">
        <div id="modalBoxContainer" class="border-2 rounded-lg max-w-4xl w-full overflow-hidden shadow-[0_25px_60px_-15px_rgba(0,0,0,0.9)] relative transition-all duration-300">
            <button onclick="fecharModal()" class="absolute top-3 right-3 text-slate-200 hover:text-white bg-black/50 hover:bg-black/80 rounded-full w-8 h-8 flex items-center justify-center font-bold transition z-30">✕</button>
            <div id="modalConteudo" class="grid grid-cols-1 md:grid-cols-2 max-h-[90vh] overflow-y-auto relative"></div>
            <div class="hidden md:block absolute top-0 bottom-0 left-1/2 w-6 -ml-3 pointer-events-none dobra-livro z-20"></div>
        </div>
    </div>

    <script>
        const API_URL = 'https://script.google.com/macros/s/AKfycbyxuYyKRAKJXYIGU-4tx8nq9i1C53QAKTgcvFzgMYhPgaf5UXEkPIGsfYmm1eGcq9oGiQ/exec';

        let colecao = [];
        let formatoSelecionado = ''; 

        /* Cores base mais claras e vibrantes para as lombadas */
        const paletasLombadas = [
            { baseColor: '#5c3317', modalBg: '#1c1008', modalBorder: '#5c3317', capaFundo: '#241306', destaqueCor: 'text-amber-400' }, 
            { baseColor: '#7a2517', modalBg: '#1c0c07', modalBorder: '#612115', capaFundo: '#2b0e07', destaqueCor: 'text-rose-400' }, 
            { baseColor: '#1d4a33', modalBg: '#09140f', modalBorder: '#1f4a35', capaFundo: '#0d1c15', destaqueCor: 'text-emerald-400' }, 
            { baseColor: '#4f2373', modalBg: '#160821', modalBorder: '#4a2366', capaFundo: '#1f0d2c', destaqueCor: 'text-purple-400' }, 
            { baseColor: '#734d17', modalBg: '#1f1406', modalBorder: '#69481a', capaFundo: '#2c1b09', destaqueCor: 'text-yellow-400' }, 
            { baseColor: '#1b416e', modalBg: '#08121f', modalBorder: '#20436b', capaFundo: '#0c1a2c', destaqueCor: 'text-cyan-400' }  
        ];

        const fontesDisponiveis = [
            'ui-sans-serif, system-ui, sans-serif',
            'ui-serif, Georgia, Cambria, serif',
            'ui-monospace, SFMono-Regular, monospace'
        ];

        async function carregarDados() {
            try {
                const response = await fetch(API_URL);
                if (!response.ok) throw new Error('Erro na resposta do servidor');
                let dadosBrutos = await response.json();
                
                colecao = dadosBrutos.filter(item => item.titulo && item.titulo.toString().trim() !== "");
                
                document.getElementById('loading').style.display = 'none';
                document.getElementById('estanteContainer').classList.remove('hidden');
                
                atualizarEstatisticas(colecao);
                criarBotoesFiltro(colecao);
                aplicarFiltros(); 
            } catch (error) {
                document.getElementById('loading').innerText = 'Erro ao carregar os dados. Verifique a conexão.';
                console.error(error);
            }
        }

        function atualizarEstatisticas(dados) {
            document.getElementById('stat-total').innerText = dados.length;
        }

        function criarBotoesFiltro(dados) {
            const container = document.getElementById('formatFilters');
            const formatosMap = {};

            dados.forEach(item => {
                let fmt = item.formato ? item.formato.toString().trim() : 'Indefinido';
                formatosMap[fmt] = (formatosMap[fmt] || 0) + 1;
            });

            let htmlBotoes = `<button data-format="todos" class="filtro-btn shrink-0 px-3.5 py-1.5 rounded-full text-xs font-semibold bg-slate-900 border border-slate-700 text-slate-300 hover:bg-slate-800 transition-all backdrop-blur-sm">Todos (${dados.length})</button>`;
            
            for (let [fmt, qtd] of Object.entries(formatosMap)) {
                htmlBotoes += `<button data-format="${fmt}" class="filtro-btn shrink-0 px-3.5 py-1.5 rounded-full text-xs font-semibold bg-slate-900 border border-slate-700 text-slate-300 hover:bg-slate-800 transition-all backdrop-blur-sm">${fmt} (${qtd})</button>`;
            }
            container.innerHTML = htmlBotoes;

            document.querySelectorAll('.filtro-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const formatoEscolhido = e.currentTarget.getAttribute('data-format');
                    selecionarFiltro(formatoEscolhido);
                });
            });
        }

        function selecionarFiltro(formato) {
            if (formatoSelecionado === formato) {
                formatoSelecionado = '';
            } else {
                formatoSelecionado = formato;
            }

            document.querySelectorAll('.filtro-btn').forEach(b => {
                const fmtBtn = b.getAttribute('data-format');
                if (fmtBtn === formatoSelecionado) {
                    b.className = "filtro-btn shrink-0 px-3.5 py-1.5 rounded-full text-xs font-semibold bg-amber-600 text-white transition-all shadow";
                } else {
                    b.className = "filtro-btn shrink-0 px-3.5 py-1.5 rounded-full text-xs font-semibold bg-slate-900 border border-slate-700 text-slate-300 hover:bg-slate-800 transition-all backdrop-blur-sm";
                }
            });

            aplicarFiltros();
        }

        function aplicarFiltros() {
            const termoBusca = document.getElementById('searchInput').value.toLowerCase().trim();
            const statusExibicao = document.getElementById('status-exibicao');

            const filtrados = colecao.filter(item => {
                const titulo = item.titulo ? item.titulo.toString().toLowerCase() : '';
                const formatoItem = item.formato ? item.formato.toString().trim() : 'Indefinido';
                
                const matchTexto = termoBusca === '' || titulo.includes(termoBusca);
                const matchFormato = formatoSelecionado === '' || formatoSelecionado === 'todos' || formatoItem.toLowerCase() === formatoSelecionado.toLowerCase();

                return matchTexto && matchFormato;
            });

            let dadosParaRenderizar = filtrados;
            const itensPorPrateleira = 15; 
            const maxEstantesIniciais = 5;

            if (termoBusca === '' && formatoSelecionado === '') {
                const limiteMaximoInicial = maxEstantesIniciais * itensPorPrateleira;
                dadosParaRenderizar = colecao.slice(0, limiteMaximoInicial);
                statusExibicao.innerText = `Mostrando as primeiras ${Math.min(maxEstantesIniciais, Math.ceil(colecao.length / itensPorPrateleira))} estantes do acervo:`;
            } else {
                statusExibicao.innerText = `Resultados encontrados (${filtrados.length}):`;
            }

            renderizarEstantesEmPrateleiras(dadosParaRenderizar, itensPorPrateleira);
        }

        function renderizarEstantesEmPrateleiras(dados, itensPorPrateleira) {
            const wrapper = document.getElementById('prateleirasWrapper');
            wrapper.innerHTML = '';

            if (dados.length === 0) {
                wrapper.innerHTML = `
                    <div class="shelf p-8 text-center text-slate-300 italic text-sm justify-center">
                        Nenhum livro encontrado nesta estante com os critérios informados.
                    </div>
                `;
                return;
            }

            for (let i = 0; i < dados.length; i += itensPorPrateleira) {
                const lote = dados.slice(i, i + itensPorPrateleira);
                
                const shelfDiv = document.createElement('div');
                shelfDiv.className = 'shelf card-organizando';
                shelfDiv.style.animationDelay = `${(i / itensPorPrateleira) * 0.1}s`;

                const posicoesVazios = [5, 10]; 

                lote.forEach((item, indexIndice) => {
                    if (posicoesVazios.includes(indexIndice)) {
                        const gap = document.createElement('div');
                        const larguraGap = 25 + ((i + indexIndice * 17) % 35); 
                        gap.className = 'shelf-gap';
                        gap.style.width = `${larguraGap}px`;
                        shelfDiv.appendChild(gap);
                    }

                    const titulo = item.titulo || 'Sem Título';
                    const volumesTexto = item.volumes ? item.volumes.toString().trim() : '';
                    const quantidadeAdquirida = item.quantidade ? parseInt(item.quantidade) : (item.qtd ? parseInt(item.qtd) : 1);

                    const seed = (i + indexIndice) * 997;

                    const altFator = Math.round(155 + ((seed % 7) * 5)); 
                    const larguraFinal = Math.round(28 + (Math.max(quantidadeAdquirida, 1) * 4.5)); 

                    const tamanhoLetra = 11 + (seed % 3);
                    const familiaFonte = fontesDisponiveis[seed % fontesDisponiveis.length];

                    const temCapaValida = item.capa && item.capa.toString().startsWith('http');
                    const capaUrl = temCapaValida ? item.capa : '';

                    const paleta = paletasLombadas[(i + indexIndice) % paletasLombadas.length];

                    const spine = document.createElement('div');
                    spine.className = 'book-spine';
                    spine.style.backgroundColor = paleta.baseColor;
                    spine.style.height = `${altFator}px`;
                    spine.style.width = `${larguraFinal}px`;

                    spine.addEventListener('click', () => {
                        abrirModalLivro(item, capaUrl, i + indexIndice);
                    });

                    spine.innerHTML = `
                        <div></div>
                        <div class="book-title-vertical" title="${titulo}" style="font-size: ${tamanhoLetra}px; font-family: ${familiaFonte}; max-height: ${altFator - 50}px;">${titulo}</div>
                        <div class="text-center text-amber-100 font-semibold truncate z-10" style="font-size: ${Math.max(tamanhoLetra - 1, 9)}px;" title="${volumesTexto}">${volumesTexto}</div>
                    `;

                    shelfDiv.appendChild(spine);
                });

                wrapper.appendChild(shelfDiv);
            }
        }

        function abrirModalLivro(item, capaUrl, indicePaleta) {
            const modal = document.getElementById('modalDetalhes');
            const modalBox = document.getElementById('modalBoxContainer');
            const conteudo = document.getElementById('modalConteudo');

            const paleta = paletasLombadas[indicePaleta % paletasLombadas.length];
            modalBox.style.backgroundColor = paleta.modalBg;
            modalBox.style.borderColor = paleta.modalBorder;

            const temCapaReal = capaUrl && capaUrl.startsWith('http');
            const imagemExibida = temCapaReal ? capaUrl : 'https://placehold.co/300x450/1e293b/cbd5e1?text=Biblioteca';

            let paginaEsquerda = `
                <div class="p-6 flex flex-col items-center justify-center border-b md:border-b-0 md:border-r border-black/40 relative shadow-inner" style="background-color: ${paleta.capaFundo};">
                    <div class="absolute inset-0 bg-gradient-to-r from-black/40 via-transparent to-transparent pointer-events-none"></div>
                    <img src="${imagemExibida}" class="w-48 h-72 sm:w-56 sm:h-80 object-cover rounded shadow-[0_15px_30px_rgba(0,0,0,0.8)] border border-black/50" alt="Capa da Obra">
                    <span class="mt-4 text-xs tracking-widest uppercase ${paleta.destaqueCor} font-bold">${item.formato || 'Acervo'}</span>
                </div>
            `;

            let paginaDireita = `
                <div class="pagina-livro p-5 sm:p-7 flex flex-col justify-between text-slate-900 shadow-inner overflow-y-auto max-h-[85vh]">
                    <div class="space-y-3">
                        <div>
                            <h2 class="text-xl sm:text-2xl font-serif font-bold text-slate-900 border-b border-amber-900/20 pb-2">${item.titulo || 'Sem Título'}</h2>
                        </div>

                        <div class="space-y-2 text-xs sm:text-sm">
            `;

            for (let [chave, valor] of Object.entries(item)) {
                if (['titulo', 'formato', 'custo', 'capa'].includes(chave)) continue;
                if (valor !== undefined && valor !== null && valor !== '') {
                    let nomeChave = chave.replace(/_/g, ' ').toUpperCase();
                    paginaDireita += `
                        <div class="bg-white/90 p-2.5 rounded border border-amber-900/10 flex justify-between gap-2 shadow-sm">
                            <span class="font-bold text-slate-600 text-[10px] uppercase">${nomeChave}:</span>
                            <span class="text-slate-900 font-medium text-right">${valor}</span>
                        </div>
                    `;
                }
            }

            paginaDireita += `
                        </div>
                    </div>
                </div>
            `;

            conteudo.innerHTML = paginaEsquerda + paginaDireita;
            modal.classList.remove('hidden');
        }

        function fecharModal() {
            document.getElementById('modalDetalhes').classList.add('hidden');
        }

        document.getElementById('modalDetalhes').addEventListener('click', (e) => {
            if (e.target.id === 'modalDetalhes') fecharModal();
        });

        document.getElementById('searchInput').addEventListener('input', aplicarFiltros);

        carregarDados();
    </script>
</body>
</html>
