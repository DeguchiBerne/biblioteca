<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca do Berne</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Estilos base das lombadas */
        .lombada-livro {
            box-shadow: inset 4px 0 8px rgba(255, 255, 255, 0.08), inset -4px 0 10px rgba(0, 0, 0, 0.5), 0 8px 12px -3px rgba(0, 0, 0, 0.6);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            transform-style: preserve-3d;
        }
        .lombada-livro:hover {
            transform: translateY(-8px) scale(1.03) translateZ(10px);
            box-shadow: inset 4px 0 12px rgba(255, 255, 255, 0.15), inset -4px 0 14px rgba(0, 0, 0, 0.6), 0 18px 30px -5px rgba(0, 0, 0, 0.8);
            z-index: 10;
        }
        .spine-line {
            border-color: rgba(255, 255, 255, 0.2);
        }

        /* Efeito de pixelização da capa na lombada (80% pixelizado / mosaico) */
        .lombada-com-capa {
            background-size: cover;
            background-position: center;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            filter: contrast(1.1) saturate(1.2);
        }

        /* Efeito de Livro Aberto suave ao abrir o modal */
        #modalDetalhes > div {
            animation: abrirLivro 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            transform-origin: center;
        }
        @keyframes abrirLivro {
            0% {
                opacity: 0;
                transform: scale(0.7) rotateY(-15deg);
            }
            100% {
                opacity: 1;
                transform: scale(1) rotateY(0deg);
            }
        }

        /* Animação suave para os cards ao filtrar (efeito de organização) */
        @keyframes organizarEstante {
            0% {
                opacity: 0;
                transform: translateY(15px) scale(0.95);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
        .card-organizando {
            animation: organizarEstante 0.4s ease-in-out forwards;
        }

        /* Textura interna simulando páginas de livro antigo */
        .pagina-livro {
            background-color: #fcf8f2;
            background-image: radial-gradient(#e6dbcc 0.75px, transparent 0.75px);
            background-size: 16px 16px;
        }

        /* Efeito de marca-página/lombada central no livro aberto */
        .dobra-livro {
            background: linear-gradient(90deg, rgba(0,0,0,0.15), rgba(0,0,0,0.05) 50%, rgba(0,0,0,0.25));
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-3 sm:p-6 pb-28 relative bg-cover bg-center bg-fixed" style="background-image: linear-gradient(rgba(15, 23, 42, 0.93), rgba(15, 23, 42, 0.93)), url('https://raw.githubusercontent.com/DeguchiBerne/biblioteca/main/bibliofundo.jpg');">
    <div class="max-w-7xl mx-auto">
        <header class="mb-6 text-center flex flex-col items-center">
            <!-- Botão de Adicionar Item -->
            <div class="w-full flex justify-end sm:absolute sm:right-0 sm:top-0 mb-4 sm:mb-0">
                <button onclick="abrirModalAdd()" class="w-full sm:w-auto bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2.5 rounded-lg text-sm font-semibold shadow transition flex items-center justify-center gap-2">
                    ➕ Adicionar Obra
                </button>
            </div>

            <h1 class="text-2xl sm:text-4xl font-bold mb-1">📚 Biblioteca do Berne</h1>
            <p class="text-xs sm:text-sm text-slate-400">Controle, visualização e estatísticas do acervo pessoal</p>
            
            <!-- Painel de Indicadores -->
            <div id="stats" class="grid grid-cols-2 gap-3 my-5 w-full max-w-md">
                <div class="bg-slate-800/80 backdrop-blur border border-slate-700 p-3 rounded-lg shadow text-center">
                    <p class="text-[10px] sm:text-xs text-slate-400 uppercase tracking-wider">Total de Obras</p>
                    <p id="stat-total" class="text-xl sm:text-2xl font-bold text-indigo-400">0</p>
                </div>
                <div class="bg-slate-800/80 backdrop-blur border border-slate-700 p-3 rounded-lg shadow text-center">
                    <p class="text-[10px] sm:text-xs text-slate-400 uppercase tracking-wider">Investimento</p>
                    <p id="stat-custo" class="text-lg sm:text-2xl font-bold text-emerald-400 truncate">R$ 0,00</p>
                </div>
            </div>

            <!-- Barra de Pesquisa -->
            <div class="w-full max-w-md mt-2">
                <input type="text" id="searchInput" placeholder="Pesquisar por título..." 
                    class="w-full px-4 py-2.5 rounded-lg bg-slate-800/90 border border-slate-700 text-white text-sm focus:outline-none focus:border-indigo-500">
            </div>

            <!-- Botões de Filtros por Formato -->
            <div id="formatFilters" class="flex overflow-x-auto w-full max-w-3xl gap-2 mt-4 pb-2 px-1 justify-start sm:justify-center scrollbar-none"></div>
        </header>

        <!-- Indicador de Carregamento -->
        <div id="loading" class="text-center text-slate-400 py-20 text-base">Organizando a estante virtual...</div>

        <!-- Grade de Lombadas de Livros -->
        <div id="grid" class="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-6 lg:grid-cols-8 gap-3 sm:gap-4"></div>
    </div>

    <!-- Rodapé -->
    <footer class="absolute bottom-0 left-0 w-full text-center py-3 bg-slate-950/90 border-t border-slate-800 text-[11px] sm:text-xs text-slate-400 space-y-0.5 px-2">
        <p>Criado por <strong class="text-slate-300">Bernardo Deguchi</strong> • 2026</p>
        <p class="text-slate-500">Acervo sincronizado via Google Sheets • Todos os direitos reservados</p>
    </footer>

    <!-- Modal de Detalhes (Livro Aberto 2 Páginas com Cores Dinâmicas) -->
    <div id="modalDetalhes" class="fixed inset-0 bg-black/80 backdrop-blur-md hidden z-50 flex items-center justify-center p-2 sm:p-4">
        <div id="modalBoxContainer" class="border-2 rounded-lg max-w-4xl w-full overflow-hidden shadow-[0_25px_60px_-15px_rgba(0,0,0,0.9)] relative transition-all duration-300">
            <button onclick="fecharModal()" class="absolute top-3 right-3 text-slate-200 hover:text-white bg-black/50 hover:bg-black/80 rounded-full w-8 h-8 flex items-center justify-center font-bold transition z-30">✕</button>
            <div id="modalConteudo" class="grid grid-cols-1 md:grid-cols-2 max-h-[90vh] overflow-y-auto relative"></div>
            <!-- Dobra central simulando a lombada interna do livro aberto -->
            <div class="hidden md:block absolute top-0 bottom-0 left-1/2 w-6 -ml-3 pointer-events-none dobra-livro z-20"></div>
        </div>
    </div>

    <!-- Modal de Adicionar Novo Item -->
    <div id="modalAdd" class="fixed inset-0 bg-black/75 backdrop-blur-sm hidden z-50 flex items-center justify-center p-3 sm:p-4">
        <div class="bg-slate-800 border border-slate-700 rounded-xl max-w-md w-full overflow-hidden shadow-2xl relative p-4 sm:p-6">
            <button onclick="fecharModalAdd()" class="absolute top-3 right-3 text-slate-400 hover:text-white bg-slate-900/80 rounded-full p-2 transition">✕</button>
            <h2 class="text-lg sm:text-xl font-bold text-white mb-3">Adicionar Nova Obra</h2>
            
            <form id="formAdd" onsubmit="enviarNovoItem(event)" class="space-y-2.5 max-h-[80vh] overflow-y-auto pr-1">
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Título *</label>
                    <input type="text" id="add-titulo" required class="w-full px-3 py-2 rounded bg-slate-900 border border-slate-700 text-white text-sm focus:outline-none focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Formato</label>
                    <input type="text" id="add-formato" placeholder="Ex: Livro, Formatinho..." class="w-full px-3 py-2 rounded bg-slate-900 border border-slate-700 text-white text-sm focus:outline-none focus:border-indigo-500">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">Possuo</label>
                        <input type="text" id="add-sim_adquirido" class="w-full px-3 py-2 rounded bg-slate-900 border border-slate-700 text-white text-sm focus:outline-none focus:border-indigo-500">
                    </div>
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">Falta</label>
                        <input type="text" id="add-nao_faltante" class="w-full px-3 py-2 rounded bg-slate-900 border border-slate-700 text-white text-sm focus:outline-none focus:border-indigo-500">
                    </div>
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Custo (R$)</label>
                    <input type="text" id="add-custo" placeholder="Ex: 29,90" class="w-full px-3 py-2 rounded bg-slate-900 border border-slate-700 text-white text-sm focus:outline-none focus:border-indigo-500">
                </div>
                
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Enviar Foto da Capa (Arquivo)</label>
                    <input type="file" id="add-arquivo-capa" accept="image/*" class="w-full px-3 py-1.5 rounded bg-slate-900 border border-slate-700 text-white text-xs file:mr-4 file:py-1 file:px-3 file:rounded file:border-0 file:text-xs file:font-semibold file:bg-indigo-600 file:text-white hover:file:bg-indigo-500">
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Ou Link da Capa (Opcional)</label>
                    <input type="url" id="add-capa" placeholder="https://..." class="w-full px-3 py-2 rounded bg-slate-900 border border-slate-700 text-white text-sm focus:outline-none focus:border-indigo-500">
                </div>

                <div>
                    <label class="block text-xs text-slate-400 mb-1">Senha de Autorização *</label>
                    <input type="password" id="add-senha" required placeholder="Digite sua senha" class="w-full px-3 py-2 rounded bg-slate-900 border border-slate-700 text-white text-sm focus:outline-none focus:border-indigo-500">
                </div>
                
                <p id="msgRetorno" class="text-xs text-center mt-2"></p>

                <button type="submit" id="btnSalvar" class="w-full mt-3 bg-indigo-600 hover:bg-indigo-500 text-white py-2.5 rounded font-semibold text-sm transition">Salvar na Planilha</button>
            </form>
        </div>
    </div>

    <script>
        const API_URL = 'https://script.google.com/macros/s/AKfycbyxuYyKRAKJXYIGU-4tx8nq9i1C53QAKTgcvFzgMYhPgaf5UXEkPIGsfYmm1eGcq9oGiQ/exec';

        let colecao = [];
        let formatoSelecionado = 'todos';

        // Paletas de fallback caso o livro não tenha capa cadastrada
        const paletasLombadas = [
            { bg: 'linear-gradient(90deg, #1e293b 0%, #334155 15%, #1e293b 85%, #0f172a 100%)', text: 'text-indigo-200', accent: 'bg-indigo-500', modalBg: '#111827', modalBorder: '#374151', capaFundo: '#1f2937', destaqueCor: 'text-indigo-400' },
            { bg: 'linear-gradient(90deg, #450a0a 0%, #7f1d1d 15%, #450a0a 85%, #260505 100%)', text: 'text-rose-200', accent: 'bg-rose-500', modalBg: '#1c1010', modalBorder: '#5c1d1d', capaFundo: '#2c1515', destaqueCor: 'text-rose-400' },
            { bg: 'linear-gradient(90deg, #064e3b 0%, #065f46 15%, #064e3b 85%, #022c22 100%)', text: 'text-emerald-200', accent: 'bg-emerald-500', modalBg: '#0b1d17', modalBorder: '#134e38', capaFundo: '#112a21', destaqueCor: 'text-emerald-400' },
            { bg: 'linear-gradient(90deg, #3b0764 0%, #581c87 15%, #3b0764 85%, #2e1065 100%)', text: 'text-purple-200', accent: 'bg-purple-500', modalBg: '#190c24', modalBorder: '#4c1d95', capaFundo: '#251038', destaqueCor: 'text-purple-400' },
            { bg: 'linear-gradient(90deg, #431407 0%, #78350f 15%, #431407 85%, #291104 100%)', text: 'text-amber-200', accent: 'bg-amber-500', modalBg: '#1c1208', modalBorder: '#78350f', capaFundo: '#2b1a0d', destaqueCor: 'text-amber-400' },
            { bg: 'linear-gradient(90deg, #0f172a 0%, #1e293b 15%, #0f172a 85%, #020617 100%)', text: 'text-cyan-200', accent: 'bg-cyan-500', modalBg: '#08101a', modalBorder: '#1e3a8a', capaFundo: '#0f172a', destaqueCor: 'text-cyan-400' }
        ];

        const estilosTitulos = [
            'font-serif tracking-wide italic font-medium',
            'font-sans tracking-tight font-bold uppercase',
            'font-mono tracking-normal font-semibold',
            'font-serif tracking-widest font-bold'
        ];

        async function carregarDados() {
            try {
                const response = await fetch(API_URL);
                if (!response.ok) throw new Error('Erro na resposta do servidor');
                let dadosBrutos = await response.json();
                
                colecao = dadosBrutos.filter(item => item.titulo && item.titulo.toString().trim() !== "");
                
                document.getElementById('loading').style.display = 'none';
                
                atualizarEstatisticas(colecao);
                criarBotoesFiltro(colecao);
                renderizarCards(colecao);
            } catch (error) {
                document.getElementById('loading').innerText = 'Erro ao carregar os dados. Verifique a conexão.';
                console.error(error);
            }
        }

        function converterParaNumero(valorStr) {
            if (!valorStr) return 0;
            let str = valorStr.toString().trim();
            if (!isNaN(str)) return parseFloat(str);

            str = str.replace(/[^\d.,]/g, '');
            if (str === '') return 0;

            if (str.includes(',') && str.includes('.')) {
                if (str.indexOf('.') < str.indexOf(',')) {
                    str = str.replace(/\./g, '').replace(',', '.');
                } else {
                    str = str.replace(/,/g, '');
                }
            } else if (str.includes(',')) {
                str = str.replace(',', '.');
            }

            let num = parseFloat(str);
            return isNaN(num) ? 0 : num;
        }

        function formatarMoeda(valorStr) {
            const num = converterParaNumero(valorStr);
            if (num === 0 && (!valorStr || valorStr.toString().trim() === '' || valorStr.toString().includes('0'))) {
                return valorStr ? valorStr : 'R$ 0,00';
            }
            return num.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
        }

        function atualizarEstatisticas(dados) {
            const totalObras = dados.length;
            let custoTotal = 0;

            dados.forEach(item => {
                custoTotal += converterParaNumero(item.custo);
            });

            document.getElementById('stat-total').innerText = totalObras;
            document.getElementById('stat-custo').innerText = custoTotal.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
        }

        function criarBotoesFiltro(dados) {
            const container = document.getElementById('formatFilters');
            const formatosMap = {};

            dados.forEach(item => {
                let fmt = item.formato ? item.formato.toString().trim() : 'Indefinido';
                formatosMap[fmt] = (formatosMap[fmt] || 0) + 1;
            });

            let htmlBotoes = `<button data-format="todos" class="filtro-btn shrink-0 px-3.5 py-1.5 rounded-full text-xs font-semibold bg-indigo-600 text-white transition-all shadow">Todos (${dados.length})</button>`;
            
            for (let [fmt, qtd] of Object.entries(formatosMap)) {
                htmlBotoes += `<button data-format="${fmt}" class="filtro-btn shrink-0 px-3.5 py-1.5 rounded-full text-xs font-semibold bg-slate-800/90 border border-slate-700 text-slate-300 hover:bg-slate-700 transition-all">${fmt} (${qtd})</button>`;
            }
            container.innerHTML = htmlBotoes;

            document.querySelectorAll('.filtro-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const formatoEscolhido = e.currentTarget.getAttribute('data-format');
                    selecionarFiltro(formatoEscolhido);
                });
            });
        }

        function selecionarFiltro(formato) {
            formatoSelecionado = formato;

            document.querySelectorAll('.filtro-btn').forEach(b => {
                if (b.getAttribute('data-format') === formato) {
                    b.className = "filtro-btn shrink-0 px-3.5 py-1.5 rounded-full text-xs font-semibold bg-indigo-600 text-white transition-all shadow";
                } else {
                    b.className = "filtro-btn shrink-0 px-3.5 py-1.5 rounded-full text-xs font-semibold bg-slate-800/90 border border-slate-700 text-slate-300 hover:bg-slate-700 transition-all";
                }
            });

            aplicarFiltros();
        }

        function aplicarFiltros() {
            const termoBusca = document.getElementById('searchInput').value.toLowerCase();

            const filtrados = colecao.filter(item => {
                const titulo = item.titulo ? item.titulo.toString().toLowerCase() : '';
                const formatoItem = item.formato ? item.formato.toString().trim() : 'Indefinido';
                
                const matchTexto = titulo.includes(termoBusca);
                const matchFormato = formatoSelecionado === 'todos' || formatoItem.toLowerCase() === formatoSelecionado.toLowerCase();

                return matchTexto && matchFormato;
            });

            renderizarCards(filtrados);
        }

        function renderizarCards(dados) {
            const grid = document.getElementById('grid');
            grid.innerHTML = '';

            if (dados.length === 0) {
                grid.innerHTML = `<p class="col-span-full text-center text-slate-500 py-10 text-sm">Nenhum item encontrado na estante.</p>`;
                return;
            }

            dados.forEach((item, index) => {
                const titulo = item.titulo || 'Sem Título';
                const formato = item.formato || 'Livro';
                const custoFormatado = formatarMoeda(item.custo);
                
                const temCapaValida = item.capa && item.capa.toString().startsWith('http');
                let capa = temCapaValida 
                    ? item.capa 
                    : 'https://placehold.co/300x450/1e293b/cbd5e1?text=Biblioteca';

                const paleta = paletasLombadas[index % paletasLombadas.length];
                const estiloTitulo = estilosTitulos[index % estilosTitulos.length];

                const card = document.createElement('div');
                card.className = 'lombada-livro card-organizando border border-slate-700/60 rounded-md p-2.5 flex flex-col justify-between cursor-pointer min-h-[220px] sm:min-h-[260px] relative overflow-hidden group';
                
                if (temCapaValida) {
                    // Se possui capa válida, aplica a imagem com efeito pixelizado (80%) e overlay escuro sutil
                    card.style.backgroundImage = `linear-gradient(rgba(0, 0, 0, 0.45), rgba(0, 0, 0, 0.45)), url('${capa}')`;
                    card.classList.add('lombada-com-capa');
                } else {
                    // Caso contrário, usa a cor aleatória padrão
                    card.style.background = paleta.bg;
                }

                card.style.animationDelay = `${index * 0.03}s`;
                
                card.addEventListener('click', () => {
                    abrirModalLivro(item, capa, custoFormatado, index);
                });

                card.innerHTML = `
                    <div class="space-y-1 mb-2 z-10">
                        <div class="border-b spine-line w-full pb-1 flex justify-between items-center">
                            <span class="text-[8px] uppercase tracking-wider text-slate-200 font-bold truncate max-w-[70px]">${formato}</span>
                        </div>
                        <div class="border-b spine-line w-full"></div>
                    </div>
                    <div class="my-auto py-1 z-10">
                        <h2 class="${estiloTitulo} text-xs sm:text-sm text-white group-hover:brightness-125 transition-all line-clamp-5 text-center leading-snug drop-shadow-[0_1px_2px_rgba(0,0,0,0.9)]" title="${titulo}">${titulo}</h2>
                    </div>
                    <div class="space-y-1 mt-2 pt-1 border-t spine-line text-center z-10">
                        <div class="w-2 h-2 rounded-full ${temCapaValida ? 'bg-amber-400' : paleta.accent} mx-auto opacity-80 group-hover:opacity-100 transition-opacity"></div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function abrirModalLivro(item, capaUrl, custoFmt, indicePaleta) {
            const modal = document.getElementById('modalDetalhes');
            const modalBox = document.getElementById('modalBoxContainer');
            const conteudo = document.getElementById('modalConteudo');

            const paleta = paletasLombadas[indicePaleta % paletasLombadas.length];

            modalBox.style.backgroundColor = paleta.modalBg;
            modalBox.style.borderColor = paleta.modalBorder;

            let paginaEsquerda = `
                <div class="p-6 flex flex-col items-center justify-center border-b md:border-b-0 md:border-r border-black/30 relative shadow-inner" style="background-color: ${paleta.capaFundo};">
                    <div class="absolute inset-0 bg-gradient-to-r from-black/30 via-transparent to-transparent pointer-events-none"></div>
                    <img src="${capaUrl}" class="w-48 h-72 sm:w-56 sm:h-80 object-cover rounded shadow-[0_15px_30px_rgba(0,0,0,0.8)] border border-black/40" alt="Capa">
                    <span class="mt-4 text-xs tracking-widest uppercase ${paleta.destaqueCor} font-bold">${item.formato || 'Acervo'}</span>
                </div>
            `;

            let paginaDireita = `
                <div class="pagina-livro p-5 sm:p-7 flex flex-col justify-between text-slate-900 shadow-inner overflow-y-auto max-h-[85vh]">
                    <div class="space-y-3">
                        <div>
                            <h2 class="text-xl sm:text-2xl font-serif font-bold text-slate-900 border-b border-amber-900/20 pb-2">${item.titulo || 'Sem Título'}</h2>
                            <p class="font-bold text-base mt-1 text-emerald-800">Investimento: ${custoFmt}</p>
                        </div>

                        <div class="space-y-2 text-xs sm:text-sm">
            `;

            for (let [chave, valor] of Object.entries(item)) {
                if (['titulo', 'formato', 'custo', 'capa'].includes(chave)) continue;
                if (valor !== undefined && valor !== null && valor !== '') {
                    let nomeChave = chave.replace(/_/g, ' ').toUpperCase();
                    paginaDireita += `
                        <div class="bg-white/90 p-2.5 rounded border border-amber-900/10 flex justify-between gap-2 shadow-sm">
                            <span class="font-bold text-slate-600 text-[10px] uppercase">${nomeChave}:</span>
                            <span class="text-slate-900 font-medium text-right">${valor}</span>
                        </div>
                    `;
                }
            }

            paginaDireita += `
                        </div>
                    </div>

                    <div class="mt-6 pt-4 border-t border-amber-900/20 bg-amber-100/50 p-3 rounded-lg border">
                        <h3 class="font-bold text-xs text-slate-800 mb-2">📸 Atualizar Foto da Capa</h3>
                        <form onsubmit="atualizarCapaItem(event, '${item.titulo.replace(/'/g, "\\'")}')" class="space-y-2">
                            <div>
                                <input type="file" id="update-arquivo-capa" accept="image/*" required class="w-full px-2 py-1 rounded bg-white border border-amber-900/20 text-slate-800 text-xs file:mr-2 file:py-1 file:px-2 file:rounded file:border-0 file:text-xs file:font-semibold file:bg-amber-800 file:text-white hover:file:bg-amber-900">
                            </div>
                            <div>

                        </form>
                    </div>
                </div>
            `;

            conteudo.innerHTML = paginaEsquerda + paginaDireita;
            modal.classList.remove('hidden');
        }

        function fecharModal() {
            document.getElementById('modalDetalhes').classList.add('hidden');
        }

        function abrirModalAdd() {
            document.getElementById('modalAdd').classList.remove('hidden');
            document.getElementById('msgRetorno').innerText = '';
            document.getElementById('formAdd').reset();
        }

        function fecharModalAdd() {
            document.getElementById('modalAdd').classList.add('hidden');
        }

        async function enviarNovoItem(event) {
            event.preventDefault();
            const btn = document.getElementById('btnSalvar');
            const msg = document.getElementById('msgRetorno');
            
            btn.innerText = 'Processando imagem e salvando...';
            btn.disabled = true;

            const arquivoInput = document.getElementById('add-arquivo-capa');
            let imagemBase64 = "";
            let nomeArquivo = "";
            let tipoMime = "";

            if (arquivoInput.files && arquivoInput.files[0]) {
                const file = arquivoInput.files[0];
                nomeArquivo = file.name;
                tipoMime = file.type;
                
                imagemBase64 = await new Promise((resolve) => {
                    const reader = new FileReader();
                    reader.onload = (e) => resolve(e.target.result.split(',')[1]);
                    reader.readAsDataURL(file);
                });
            }

            const payload = {
                senha: document.getElementById('add-senha').value,
                titulo: document.getElementById('add-titulo').value,
                formato: document.getElementById('add-formato').value,
                sim_adquirido: document.getElementById('add-sim_adquirido').value,
                nao_faltante: document.getElementById('add-nao_faltante').value,
                custo: document.getElementById('add-custo').value,
                capa: document.getElementById('add-capa').value,
                imagemBase64: imagemBase64,
                nomeArquivo: nomeArquivo,
                tipoMime: tipoMime
            };

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });
                const resultado = await response.json();

                if (resultado.sucesso) {
                    msg.className = "text-xs text-center mt-2 text-emerald-400 font-bold";
                    msg.innerText = resultado.mensagem;
                    setTimeout(() => {
                        fecharModalAdd();
                        carregarDados();
                    }, 1500);
                } else {
                    msg.className = "text-xs text-center mt-2 text-rose-400 font-bold";
                    msg.innerText = resultado.mensagem;
                }
            } catch (err) {
                msg.className = "text-xs text-center mt-2 text-rose-400 font-bold";
                msg.innerText = "Erro de conexão ao salvar.";
            } finally {
                btn.innerText = 'Salvar na Planilha';
                btn.disabled = false;
            }
        }
