<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Biblioteca de Quadrinhos e Livros</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 sm:p-6 pb-24">
    <div class="max-w-7xl mx-auto">
        <header class="mb-8 text-center relative">
            <!-- Botão de Adicionar Item -->
            <button onclick="abrirModalAdd()" class="absolute right-0 top-0 bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-lg text-sm font-semibold shadow transition flex items-center gap-2">
                ➕ Adicionar Obra
            </button>

            <h1 class="text-3xl sm:text-4xl font-bold mb-2">📚 Minha Coleção</h1>
            <p class="text-slate-400">Controle, visualização e estatísticas do acervo</p>
            
            <!-- Painel de Indicadores (Apenas 2 colunas agora) -->
            <div id="stats" class="grid grid-cols-1 sm:grid-cols-2 gap-4 my-6 max-w-xl mx-auto">
                <div class="bg-slate-800 border border-slate-700 p-4 rounded-lg shadow">
                    <p class="text-xs text-slate-400 uppercase tracking-wider">Total de Obras</p>
                    <p id="stat-total" class="text-2xl font-bold text-indigo-400">0</p>
                </div>
                <div class="bg-slate-800 border border-slate-700 p-4 rounded-lg shadow">
                    <p class="text-xs text-slate-400 uppercase tracking-wider">Investimento Total</p>
                    <p id="stat-custo" class="text-2xl font-bold text-emerald-400">R$ 0,00</p>
                </div>
            </div>

            <!-- Barra de Pesquisa -->
            <div class="flex flex-col sm:flex-row justify-center items-center gap-4 mt-6">
                <input type="text" id="searchInput" placeholder="Pesquisar por título..." 
                    class="w-full sm:w-96 px-4 py-2 rounded-lg bg-slate-800 border border-slate-700 text-white focus:outline-none focus:border-indigo-500">
            </div>

            <!-- Botões de Filtros por Formato -->
            <div id="formatFilters" class="flex flex-wrap justify-center gap-2 mt-4"></div>
        </header>

        <!-- Indicador de Carregamento -->
        <div id="loading" class="text-center text-slate-400 py-20 text-lg">Carregando sua coleção da planilha...</div>

        <!-- Grade de Livros/Quadrinhos -->
        <div id="grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6"></div>
    </div>

    <!-- Modal de Detalhes -->
    <div id="modalDetalhes" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden z-50 flex items-center justify-center p-4">
        <div class="bg-slate-800 border border-slate-700 rounded-xl max-w-lg w-full overflow-hidden shadow-2xl relative">
            <button onclick="fecharModal()" class="absolute top-3 right-3 text-slate-400 hover:text-white bg-slate-900/60 rounded-full p-2 transition">✕</button>
            <div id="modalConteudo" class="p-6 space-y-4 max-h-[90vh] overflow-y-auto"></div>
        </div>
    </div>

    <!-- Modal de Adicionar Novo Item -->
    <div id="modalAdd" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden z-50 flex items-center justify-center p-4">
        <div class="bg-slate-800 border border-slate-700 rounded-xl max-w-md w-full overflow-hidden shadow-2xl relative p-6">
            <button onclick="fecharModalAdd()" class="absolute top-3 right-3 text-slate-400 hover:text-white bg-slate-900/60 rounded-full p-2 transition">✕</button>
            <h2 class="text-xl font-bold text-white mb-4">Adicionar Nova Obra</h2>
            
            <form id="formAdd" onsubmit="enviarNovoItem(event)" class="space-y-3">
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Título *</label>
                    <input type="text" id="add-titulo" required class="w-full px-3 py-2 rounded bg-slate-900 border border-slate-700 text-white text-sm focus:outline-none focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Formato</label>
                    <input type="text" id="add-formato" placeholder="Ex: Livro, Formatinho..." class="w-full px-3 py-2 rounded bg-slate-900 border border-slate-700 text-white text-sm focus:outline-none focus:border-indigo-500">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">Possuo</label>
                        <input type="text" id="add-sim_adquirido" class="w-full px-3 py-2 rounded bg-slate-900 border border-slate-700 text-white text-sm focus:outline-none focus:border-indigo-500">
                    </div>
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">Falta</label>
                        <input type="text" id="add-nao_faltante" class="w-full px-3 py-2 rounded bg-slate-900 border border-slate-700 text-white text-sm focus:outline-none focus:border-indigo-500">
                    </div>
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Custo (R$)</label>
                    <input type="text" id="add-custo" placeholder="Ex: 29,90" class="w-full px-3 py-2 rounded bg-slate-900 border border-slate-700 text-white text-sm focus:outline-none focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Link da Capa (Opcional)</label>
                    <input type="url" id="add-capa" placeholder="https://..." class="w-full px-3 py-2 rounded bg-slate-900 border border-slate-700 text-white text-sm focus:outline-none focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Senha de Autorização *</label>
                    <input type="password" id="add-senha" required placeholder="Digite sua senha" class="w-full px-3 py-2 rounded bg-slate-900 border border-slate-700 text-white text-sm focus:outline-none focus:border-indigo-500">
                </div>
                
                <p id="msgRetorno" class="text-xs text-center mt-2"></p>

                <button type="submit" id="btnSalvar" class="w-full mt-4 bg-indigo-600 hover:bg-indigo-500 text-white py-2 rounded font-semibold text-sm transition">Salvar na Planilha</button>
            </form>
        </div>
    </div>

    <script>
        const API_URL = 'https://script.google.com/macros/s/AKfycbyxuYyKRAKJXYIGU-4tx8nq9i1C53QAKTgcvFzgMYhPgaf5UXEkPIGsfYmm1eGcq9oGiQ/exec';

        let colecao = [];
        let formatoSelecionado = 'todos';

        async function carregarDados() {
            try {
                const response = await fetch(API_URL);
                if (!response.ok) throw new Error('Erro na resposta do servidor');
                let dadosBrutos = await response.json();
                
                colecao = dadosBrutos.filter(item => item.titulo && item.titulo.toString().trim() !== "");
                
                document.getElementById('loading').style.display = 'none';
                
                atualizarEstatisticas(colecao);
                criarBotoesFiltro(colecao);
                renderizarCards(colecao);
            } catch (error) {
                document.getElementById('loading').innerText = 'Erro ao carregar os dados. Verifique a conexão.';
                console.error(error);
            }
        }

        function converterParaNumero(valorStr) {
            if (!valorStr) return 0;
            let str = valorStr.toString().trim();
            if (!isNaN(str)) return parseFloat(str);

            str = str.replace(/[^\d.,]/g, '');
            if (str === '') return 0;

            if (str.includes(',') && str.includes('.')) {
                if (str.indexOf('.') < str.indexOf(',')) {
                    str = str.replace(/\./g, '').replace(',', '.');
                } else {
                    str = str.replace(/,/g, '');
                }
            } else if (str.includes(',')) {
                str = str.replace(',', '.');
            }

            let num = parseFloat(str);
            return isNaN(num) ? 0 : num;
        }

        function formatarMoeda(valorStr) {
            const num = converterParaNumero(valorStr);
            if (num === 0 && (!valorStr || valorStr.toString().trim() === '' || valorStr.toString().includes('0'))) {
                return valorStr ? valorStr : 'R$ 0,00';
            }
            return num.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
        }

        function atualizarEstatisticas(dados) {
            const totalObras = dados.length;
            let custoTotal = 0;

            dados.forEach(item => {
                custoTotal += converterParaNumero(item.custo);
            });

            document.getElementById('stat-total').innerText = totalObras;
            document.getElementById('stat-custo').innerText = custoTotal.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
        }

        function criarBotoesFiltro(dados) {
            const container = document.getElementById('formatFilters');
            const formatosMap = {};

            dados.forEach(item => {
                let fmt = item.formato ? item.formato.toString().trim() : 'Indefinido';
                formatosMap[fmt] = (formatosMap[fmt] || 0) + 1;
            });

            let htmlBotoes = `<button data-format="todos" class="filtro-btn px-3 py-1.5 rounded-full text-xs font-semibold bg-indigo-600 text-white transition-all shadow">Todos (${dados.length})</button>`;
            
            for (let [fmt, qtd] of Object.entries(formatosMap)) {
                htmlBotoes += `<button data-format="${fmt}" class="filtro-btn px-3 py-1.5 rounded-full text-xs font-semibold bg-slate-800 border border-slate-700 text-slate-300 hover:bg-slate-700 transition-all">${fmt} (${qtd})</button>`;
            }
            container.innerHTML = htmlBotoes;

            document.querySelectorAll('.filtro-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const formatoEscolhido = e.currentTarget.getAttribute('data-format');
                    selecionarFiltro(formatoEscolhido);
                });
            });
        }

        function selecionarFiltro(formato) {
            formatoSelecionado = formato;

            document.querySelectorAll('.filtro-btn').forEach(b => {
                if (b.getAttribute('data-format') === formato) {
                    b.className = "filtro-btn px-3 py-1.5 rounded-full text-xs font-semibold bg-indigo-600 text-white transition-all shadow";
                } else {
                    b.className = "filtro-btn px-3 py-1.5 rounded-full text-xs font-semibold bg-slate-800 border border-slate-700 text-slate-300 hover:bg-slate-700 transition-all";
                }
            });

            aplicarFiltros();
        }

        function aplicarFiltros() {
            const termoBusca = document.getElementById('searchInput').value.toLowerCase();

            const filtrados = colecao.filter(item => {
                const titulo = item.titulo ? item.titulo.toString().toLowerCase() : '';
                const formatoItem = item.formato ? item.formato.toString().trim() : 'Indefinido';
                
                const matchTexto = titulo.includes(termoBusca);
                const matchFormato = formatoSelecionado === 'todos' || formatoItem.toLowerCase() === formatoSelecionado.toLowerCase();

                return matchTexto && matchFormato;
            });

            renderizarCards(filtrados);
        }

        function renderizarCards(dados) {
            const grid = document.getElementById('grid');
            grid.innerHTML = '';

            if (dados.length === 0) {
                grid.innerHTML = `<p class="col-span-full text-center text-slate-500 py-10">Nenhum item encontrado.</p>`;
                return;
            }

            dados.forEach((item) => {
                const titulo = item.titulo || 'Sem Título';
                const formato = item.formato || 'Desconhecido';
                const custoFormatado = formatarMoeda(item.custo);
                
                let capa = item.capa && item.capa.toString().startsWith('http') 
                    ? item.capa 
                    : 'https://placehold.co/300x450/1e293b/cbd5e1?text=Biblioteca+do+Berne';

                const card = document.createElement('div');
                card.className = 'bg-slate-800 border border-slate-700 rounded-lg overflow-hidden flex flex-col justify-between shadow-lg hover:border-indigo-500 cursor-pointer transition-all transform hover:-translate-y-1';
                
                card.addEventListener('click', () => abrirModal(item, capa, custoFormatado));

                card.innerHTML = `
                    <div>
                        <div class="h-64 w-full bg-slate-900 overflow-hidden relative">
                            <img src="${capa}" alt="${titulo}" class="w-full h-full object-cover object-center" onerror="this.src='https://placehold.co/300x450/1e293b/cbd5e1?text=Biblioteca+do+Berne'">
                            <span class="absolute top-2 left-2 text-[10px] font-bold px-2 py-1 bg-slate-900/80 backdrop-blur text-indigo-200 rounded uppercase tracking-wide border border-slate-700">${formato}</span>
                            <span class="absolute top-2 right-2 text-xs font-bold px-2 py-1 bg-emerald-900/90 text-emerald-200 rounded border border-emerald-700">${custoFormatado}</span>
                        </div>
                        <div class="p-4">
                            <h2 class="font-bold text-base text-white line-clamp-2" title="${titulo}">${titulo}</h2>
                        </div>
                    </div>
                    <div class="px-4 pb-3 pt-2 text-xs text-slate-400 border-t border-slate-700/60 bg-slate-800/50 text-center">
                        <span>Clique para ver detalhes</span>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function abrirModal(item, capaUrl, custoFmt) {
            const modal = document.getElementById('modalDetalhes');
            const conteudo = document.getElementById('modalConteudo');

            let detalhesHtml = `
                <div class="flex flex-col sm:flex-row gap-4 items-center sm:items-start">
                    <img src="${capaUrl}" class="w-36 h-52 object-cover rounded-lg border border-slate-700 shadow" alt="Capa">
                    <div class="space-y-2 flex-1">
                        <span class="text-xs font-bold px-2 py-1 bg-indigo-900 text-indigo-200 rounded">${item.formato || 'Geral'}</span>
                        <h2 class="text-xl font-bold text-white">${item.titulo || 'Sem Título'}</h2>
                        <p class="text-emerald-400 font-bold text-lg">${custoFmt}</p>
                    </div>
                </div>
                <div class="border-t border-slate-700 pt-4 mt-4 space-y-3 text-sm">
            `;

            for (let [chave, valor] of Object.entries(item)) {
                if (['titulo', 'formato', 'custo', 'capa'].includes(chave)) continue;
                if (valor !== undefined && valor !== null && valor !== '') {
                    let nomeChave = chave.replace(/_/g, ' ').toUpperCase();
                    detalhesHtml += `
                        <div class="bg-slate-900/50 p-3 rounded-lg border border-slate-700/50 flex justify-between">
                            <strong class="text-slate-400 text-xs">${nomeChave}:</strong>
                            <span class="text-slate-200 text-right font-medium">${valor}</span>
                        </div>
                    `;
                }
            }

            detalhesHtml += `</div>`;
            conteudo.innerHTML = detalhesHtml;
            modal.classList.remove('hidden');
        }

        function fecharModal() {
            document.getElementById('modalDetalhes').classList.add('hidden');
        }

        function abrirModalAdd() {
            document.getElementById('modalAdd').classList.remove('hidden');
            document.getElementById('msgRetorno').innerText = '';
            document.getElementById('formAdd').reset();
        }

        function fecharModalAdd() {
            document.getElementById('modalAdd').classList.add('hidden');
        }

        async function enviarNovoItem(event) {
            event.preventDefault();
            const btn = document.getElementById('btnSalvar');
            const msg = document.getElementById('msgRetorno');
            
            btn.innerText = 'Salvando...';
            btn.disabled = true;

            const payload = {
                senha: document.getElementById('add-senha').value,
                titulo: document.getElementById('add-titulo').value,
                formato: document.getElementById('add-formato').value,
                sim_adquirido: document.getElementById('add-sim_adquirido').value,
                nao_faltante: document.getElementById('add-nao_faltante').value,
                custo: document.getElementById('add-custo').value,
                capa: document.getElementById('add-capa').value
            };

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });
                const resultado = await response.json();

                if (resultado.sucesso) {
                    msg.className = "text-xs text-center mt-2 text-emerald-400 font-bold";
                    msg.innerText = resultado.mensagem;
                    setTimeout(() => {
                        fecharModalAdd();
                        carregarDados(); // Recarrega os dados atualizados da planilha
                    }, 1500);
                } else {
                    msg.className = "text-xs text-center mt-2 text-rose-400 font-bold";
                    msg.innerText = resultado.mensagem;
                }
            } catch (err) {
                msg.className = "text-xs text-center mt-2 text-rose-400 font-bold";
                msg.innerText = "Erro de conexão ao salvar.";
            } finally {
                btn.innerText = 'Salvar na Planilha';
                btn.disabled = false;
            }
        }

        document.getElementById('modalDetalhes').addEventListener('click', (e) => {
            if (e.target.id === 'modalDetalhes') fecharModal();
        });
        document.getElementById('modalAdd').addEventListener('click', (e) => {
            if (e.target.id === 'modalAdd') fecharModalAdd();
        });

        document.getElementById('searchInput').addEventListener('input', aplicarFiltros);

        carregarDados();
    </script>
</body>
</html>
